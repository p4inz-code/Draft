[package]
name = "draft-mcp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
description = "DRAFT's MCP server: draft-mcp CLI (stdio) reads a saved .draft project and exposes it to MCP clients — see ADR-007"

[[bin]]
name = "draft-mcp"
path = "src/bin/main.rs"

[dependencies]
draft-security.workspace = true
draft-project.workspace = true
draft-graph.workspace = true
draft-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "0.8"

[dev-dependencies]
rmcp = { version = "3", features = ["client", "transport-child-process"] }
tempfile = "3"

