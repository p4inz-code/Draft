[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/draft-core",
  "crates/draft-project",
  "crates/draft-graph",
  "crates/draft-media",
  "crates/draft-mcp",
  "crates/draft-events",
  "crates/draft-security",
  "crates/draft-platform",
  "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/p4inz-code/Draft"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v7", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "net"] }
tracing = "0.1"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
dirs = "5"
sha2 = "0.10"
base64 = "0.22"

draft-core = { path = "crates/draft-core" }
draft-project = { path = "crates/draft-project" }
draft-graph = { path = "crates/draft-graph" }
draft-media = { path = "crates/draft-media" }
draft-mcp = { path = "crates/draft-mcp" }
draft-events = { path = "crates/draft-events" }
draft-security = { path = "crates/draft-security" }
draft-platform = { path = "crates/draft-platform" }

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
